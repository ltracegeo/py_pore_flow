[project]
name = "py_pore_flow"
version = "0.0.1"
dependencies = [
    "numba==0.56.2",
    "numpy==1.23.1",
    "openpnm==3.4.0",
    "PyQt6==6.7.0",
    "pyqtgraph @ git+https://github.com/ltracegeo/pyqtgraph.git@pyqtgraph-0.12.4.2",
    "pypardiso==0.4.3",
    "vtk>=9.2.20230607",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.1"
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
