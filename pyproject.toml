[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_pore_flow"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
    "numba==0.60.0",
    "numpy==1.26.4",
    "openpnm==3.4.0",
    "PySide2 @ https://github.com/ltracegeo/pyside-setup/releases/download/v5.15.12.1/pyside2-5.15.12.1-5.15.2-cp312-cp312-linux_x86_64.whl ; platform_system == \"Linux\"",
    "PySide2 @ https://github.com/ltracegeo/pyside-setup/releases/download/v5.15.12.1/pyside2-5.15.12.1-5.15.2-cp312-cp312-win_amd64.whl ; platform_system == \"Windows\"",
    "pyflowsolver",
    # "pyqtgraph @ git+https://github.com/ltracegeo/pyqtgraph.git@ltrace-0.14.0",
    "pyqtgraph @ https://github.com/ltracegeo/pyqtgraph/releases/download/ltrace-0.14.0/pyqtgraph-0.14.0-py3-none-any.whl",
    "pypardiso==0.4.3",
    "scipy==1.13.1",
    "shiboken2 @ https://github.com/ltracegeo/pyside-setup/releases/download/v5.15.12.1/shiboken2-5.15.12.1-5.15.2-cp312-cp312-linux_x86_64.whl ; platform_system == \"Linux\"",
    "shiboken2 @ https://github.com/ltracegeo/pyside-setup/releases/download/v5.15.12.1/shiboken2-5.15.12.1-5.15.2-cp312-cp312-win_amd64.whl ; platform_system == \"Windows\"",
    "vtk>=9.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.1"
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
