[project]
name = "py_pore_flow"
version = "1.1.5"
dependencies = [
    "numba==0.60.0",
    "numpy==1.26.4",
    "openpnm==3.4.0",
    "pypardiso==0.4.3",
    "vtk>=9.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.1"
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
